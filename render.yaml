services:
    - type: web
    name: openeducat_erp-1
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
            - key: HOST
        value: 0.0.0.0
            - key: PORT
        value: 8069
            - key: DB_HOST
        fromDatabase:
          name: odoo-db
          property: host
            - key: DB_PORT
        fromDatabase:
          name: odoo-db
          property: port
            - key: DB_USER
        fromDatabase:
          name: odoo-db
          property: user
            - key: DB_PASSWORD
        fromDatabase:
          name: odoo-db
          property: password
            - key: DB_NAME
        fromDatabase:
          name: odoo-db
          property: database

databases:
    - name: odoo-db
    plan: free
    databaseName: odoo
    user: odoo
